<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sporium · tahový dungeon crawler</title>
<meta name="description" content="Sporium – temný tahový dungeon crawler s ARPG itemizací, nekonečnou hloubkou a výtrusnou atmosférou.">
<meta property="og:image" content="https://viktorbrenek.github.io/game/assets/cover.jpg">
<link rel="icon" href="assets/icon.png">
<link href="../assets/fonts/fonts.css" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="preload" as="image" href="assets/ui/panel_big.webp">
</head>
<body>
<canvas id="gl"></canvas>
<canvas id="over"></canvas>
<div id="hud">
  <div id="topleft">
    <div class="who"><div id="lvl" class="lvl">1</div><div><div id="depth">Hloubka 1</div><div id="biome"></div></div></div>
    <div id="es" data-tip="es" class="bar" style="display:none"><div class="fill"></div><span class="txt"></span></div>
    <div id="hp" data-tip="hp" class="bar"><div class="fill"></div><span class="txt"></span></div>
    <div id="mp" data-tip="mp" class="bar"><div class="fill"></div><span class="txt"></span></div>
    <div id="xp" data-tip="xp" class="bar thin"><div class="fill"></div></div>
    <div class="cur"><span data-tip="gold"><img class="ico" src="assets/ui/i_gold.webp"><b id="gold">0</b></span><span class="dust" data-tip="dust"><img class="ico" src="assets/ui/i_dust.webp"><b id="dust">0</b></span><span class="cores" data-tip="cores"><img class="ico" src="assets/ui/i_core.webp"><b id="cores">0</b></span></div>
    <div id="res"></div>
    <div id="status"></div>
  </div>
  <div id="bossbar"><div class="n"></div><div class="bar"><div class="fill"></div></div></div>
  <div id="banner"></div>
  <div id="log"></div>
  <div id="skillbar"></div>
</div>
<div id="panel"></div>
<div id="tooltip"></div>
<div id="modal"></div>
<div id="loading">Klíčí výtrusy…</div>
<script type="module" src="lib/main.js"></script>
</body>
</html>
