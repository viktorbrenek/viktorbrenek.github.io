<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sporium · tahový dungeon crawler</title>
<meta name="description" content="Sporium – temný tahový dungeon crawler s ARPG itemizací, nekonečnou hloubkou a výtrusnou atmosférou.">
<meta property="og:image" content="https://viktorbrenek.github.io/game/assets/cover.jpg">
<link rel="icon" href="assets/icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alegreya+Sans:wght@400;500;700;800&family=Grenze+Gotisch:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="preload" as="image" href="assets/ui/panel_big.webp">
</head>
<body>
<canvas id="gl"></canvas>
<canvas id="over"></canvas>
<div id="hud">
  <div id="topleft">
    <div class="who"><div id="lvl" class="lvl">1</div><div><div id="depth">Hloubka 1</div><div id="biome"></div></div></div>
    <div id="es" class="bar" style="display:none"><div class="fill"></div><span class="txt"></span></div>
    <div id="hp" class="bar"><div class="fill"></div><span class="txt"></span></div>
    <div id="mp" class="bar"><div class="fill"></div><span class="txt"></span></div>
    <div id="xp" class="bar thin"><div class="fill"></div></div>
    <div class="cur"><span><img class="ico" src="assets/ui/i_gold.webp"><b id="gold">0</b></span><span class="dust"><img class="ico" src="assets/ui/i_dust.webp"><b id="dust">0</b></span><span class="cores" title="Zkažená jádra"><img class="ico" src="assets/ui/i_rdecay.webp"><b id="cores">0</b></span></div>
    <div id="res"></div>
    <div id="status"></div>
  </div>
  <div id="bossbar"><div class="n"></div><div class="bar"><div class="fill"></div></div></div>
  <div id="banner"></div>
  <div id="log"></div>
  <div id="skillbar"></div>
</div>
<div id="panel"></div>
<div id="tooltip"></div>
<div id="modal"></div>
<div id="loading">Klíčí výtrusy…</div>
<script type="module" src="lib/main.js"></script>
</body>
</html>
